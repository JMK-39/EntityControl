name: Build and publish mod

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/auto-release.yml'
      - 'build.*.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle'
      - 'stonecutter.gradle'
      - 'src/**'
      - 'versions/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mod-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Gradle runs on Java 21, and 1.20.1 and 1.21.1 both compile for Java 21.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.8.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Set release version and artifact name
        id: release
        run: |
          mod_id="$(awk -F= '$1 == "mod_id" { print $2; exit }' gradle.properties)"
          mod_name="$(awk -F= '$1 == "mod_name" { print substr($0, index($0, "=") + 1); exit }' gradle.properties)"
          if [ -z "$mod_id" ]; then
            echo "gradle.properties must define mod_id" >&2
            exit 1
          fi
          if [ -z "$mod_name" ]; then
            mod_name="${GITHUB_REPOSITORY##*/}"
          fi
          version="$(TZ=Asia/Shanghai date +'%y.%-m.%-d')"
          {
            echo "mod_id=$mod_id"
            echo "mod_name=$mod_name"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      # Builds one JAR per enabled Minecraft version: <mod_id>-<loader>-<minecraft>-<version>.jar.
      - name: Build mod JARs
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TZ: Asia/Shanghai
        run: >-
          gradle buildAll --no-daemon --stacktrace
          -Puse_auto_version=false
          -Pmod_version="$VERSION"
          -Poutput_mods_dir=build/release

      - name: Check release artifacts
        env:
          MOD_ID: ${{ steps.release.outputs.mod_id }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          shopt -s nullglob
          artifacts=(build/release/"$MOD_ID"-*-"$VERSION".jar)
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "No release JARs in build/release" >&2
            exit 1
          fi
          for artifact in "${artifacts[@]}"; do
            test -s "$artifact"
            echo "$artifact"
          done

      - name: Publish GitHub Release
        env:
          MOD_ID: ${{ steps.release.outputs.mod_id }}
          MOD_NAME: ${{ steps.release.outputs.mod_name }}
          VERSION: ${{ steps.release.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          artifacts=(build/release/"$MOD_ID"-*-"$VERSION".jar)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${artifacts[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "${artifacts[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$MOD_NAME $VERSION" \
              --generate-notes
          fi
