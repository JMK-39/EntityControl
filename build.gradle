import org.gradle.api.GradleException
import java.text.SimpleDateFormat

buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/maven/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6.0.24'
        classpath 'org.spongepowered:mixingradle:0.7.38'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

configurations.configureEach {
    resolutionStrategy.cacheDynamicVersionsFor 99999, 'days'
    resolutionStrategy.cacheChangingModulesFor 99999, 'days'
}

def getDynamicVersion() {
    def useAuto = project.findProperty('use_auto_version')?.toString() ?: 'false'
    if (useAuto.toBoolean()) {
        return new SimpleDateFormat('yy.M.d').format(new Date())
    }
    return project.findProperty('mod_version')?.toString() ?: '0.0.0'
}

def pVersion = getDynamicVersion()
def pGroup = project.findProperty('mod_group_id')?.toString() ?: 'dev.xyat.entitycontrol'
def pModId = project.findProperty('mod_id')?.toString() ?: 'entitycontrol'
def primaryInternalModId = 'entitycontrol'
def mixinConfigList = ['entitycontrol.entityrese.mixins.json', 'entitycontrol.spawn.mixins.json']

version = pVersion
group = pGroup

base {
    archivesName.set(pModId)
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: project.findProperty('mapping_channel')?.toString() ?: 'official', version: project.findProperty('mapping_version')?.toString()
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${primaryInternalModId}" {
                    source sourceSets.main
                }
            }
        }

        client {
            mixinConfigList.each { configName -> args "-mixin.config=${configName}" }
        }

        server {
            args '--nogui'
            mixinConfigList.each { configName -> args "-mixin.config=${configName}" }
        }
    }
}

mixin {
    add sourceSets.main, "${pModId}.mixins.refmap.json"
    mixinConfigList.each { configName -> config configName }
    defaultObfuscationEnv 'searge'
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://maven.blamejared.com' }

    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }

    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }

    ivy {
        name = 'KineticCoreGitHubReleases'
        url = 'https://github.com/JMK-39/kineticCore/releases/download'
        patternLayout { artifact 'v[revision]/[artifact]-[revision].[ext]' }
        metadataSources { artifact() }
        content { includeModule 'dev.xyat.kineticcore', 'kineticcore' }
    }
}


dependencies {
    minecraft "net.minecraftforge:forge:${project.findProperty('minecraft_version')?.toString()}-${project.findProperty('forge_version')?.toString()}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly annotationProcessor("io.github.llamalad7:mixinextras-common:0.3.5")
    implementation fg.deobf("io.github.llamalad7:mixinextras-forge:0.3.5")
    implementation fg.deobf("dev.xyat.kineticcore:kineticcore:${project.findProperty('kineticcore_version')}")
    implementation fg.deobf("curse.maven:jade-324717:6855440")
    implementation fg.deobf("maven.modrinth:curios:IPQlZkz1")
}

tasks.named('jar', Jar).configure {
    def customOutputDir = project.findProperty('output_mods_dir')
    if (customOutputDir) {
        destinationDirectory = file(customOutputDir)
    }
    archiveFileName.set("${pModId}-${project.version}.jar")

    manifest {
        attributes([
                'Specification-Title'     : pModId,
                'Specification-Vendor'    : project.findProperty('mod_authors')?.toString() ?: 'Unknown',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : pVersion,
                'Implementation-Vendor'   : project.findProperty('mod_authors')?.toString() ?: 'Unknown',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : mixinConfigList.join(',')
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.register('runClientIDE') {
    group = 'build'
    description = 'Start Forge development client'
    dependsOn 'runClient'
}

tasks.register('runServerIDE') {
    group = 'build'
    description = 'Start Forge development server'
    dependsOn 'runServer'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll([
            '-nowarn',
            '-Xlint:none',
            '-Amixin.target.allowUnresolvedTarget=true',
            '-Amixin.suppressTargetWarnings=true'
    ])
}

tasks.named('compileJava', JavaCompile).configure {
    outputs.upToDateWhen { false }
}
