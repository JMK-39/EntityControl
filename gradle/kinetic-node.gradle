import java.text.SimpleDateFormat

// Build logic shared by every Minecraft version node (versions/<node>/).
// build.<loader>.gradle applies this right after its loader plugin, then hands the task that produces
// the shipped JAR to kineticConfigureReleaseJar.
// Paths point at the root project: every node builds the one source tree in src/.

def getDynamicVersion() {
    if (rootProject.ext.has('kineticBuildVersion')) return rootProject.ext.kineticBuildVersion
    def useAuto = project.findProperty('use_auto_version')?.toString() ?: 'false'
    def resolved
    if (useAuto.toBoolean()) {
        def formatter = new SimpleDateFormat("yy.M.d")
        formatter.timeZone = TimeZone.getTimeZone('Asia/Shanghai')
        resolved = formatter.format(new Date())
    } else {
        resolved = project.findProperty('mod_version')?.toString() ?: "0.0.0"
    }
    rootProject.ext.kineticBuildVersion = resolved
    return resolved
}

def pVersion = getDynamicVersion()
def pGroup = project.findProperty('mod_group_id')?.toString() ?: "dev.xyat.entitycontrol"
def pModId = project.findProperty('mod_id')?.toString() ?: "entitycontrol"
def pLoader = project.property('loader').toString()
def pMinecraft = project.property('minecraft_version').toString()
// java_version is the Java the node's Minecraft version runs on: it sets the bytecode level and the usable
// language features and JDK API. Compile and check each node with its matching JDK; Gradle
// itself runs separately on JDK 21.
def pJava = project.property('java_version').toString() as int
def pToolchain = pJava

ext.kineticModId = pModId
ext.kineticJavaVersion = pToolchain

version = pVersion
group = pGroup

base {
    archivesName.set(pModId)
}

java.toolchain.languageVersion = JavaLanguageVersion.of(pToolchain)

tasks.withType(JavaCompile).configureEach {
    javaCompiler.set(javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(pToolchain) })
    options.release.set(pJava)
}

configurations.configureEach {
    resolutionStrategy.cacheDynamicVersionsFor 99999, 'days'
    resolutionStrategy.cacheChangingModulesFor 99999, 'days'
}

def mixinConfigList = fileTree(
        dir: rootProject.file('src/main/resources'),
        include: 'entitycontrol.*.mixins.json'
).files.collect { File file -> file.name }.sort()

ext.kineticMixinConfigs = mixinConfigList

sourceSets.main.resources {
    srcDir rootProject.file('src/generated/resources')
    // Data whose folder or format differs per Minecraft version lives only in versions/<node>/resources and is
    // packaged into that node's JAR alone.
    srcDir rootProject.file("versions/${project.name}/resources")
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://maven.architectury.dev/'; content { includeGroup 'dev.architectury' } }
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    maven { url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : pMinecraft,
            minecraft_version_range: project.findProperty('minecraft_version_range')?.toString(),
            forge_version          : project.findProperty('forge_version')?.toString(),
            forge_version_range    : project.findProperty('forge_version_range')?.toString(),
            neoforge_version       : project.findProperty('neoforge_version')?.toString(),
            neoforge_version_range : project.findProperty('neoforge_version_range')?.toString(),
            loader_version_range   : project.findProperty('loader_version_range')?.toString(),
            // The mod pack serves resources and, from 1.20.2, data, whose format differs from the resource format. Up to
            // 1.21.1 that is pack_format plus supported_formats; 26.1 declares a min_format..max_format range instead.
            pack_version_fields    : project.findProperty('pack_min_format')
                    ? "\"min_format\": ${project.property('pack_min_format')},\n    \"max_format\": ${project.property('pack_max_format')}"
                    : "\"pack_format\": ${project.property('pack_format')}" + (project.findProperty('pack_supported_formats')
                        ? ",\n    \"supported_formats\": [${project.property('pack_supported_formats')}]" : ''),
            mod_id                 : pModId,
            mod_name               : project.findProperty('mod_name')?.toString(),
            mod_license            : project.findProperty('mod_license')?.toString(),
            mod_version            : pVersion,
            mod_authors            : project.findProperty('mod_authors')?.toString(),
            mod_description        : project.findProperty('mod_description')?.toString(),
            kineticcore_version_range: project.property('kineticcore_version_range').toString(),
            // NeoForge lists Mixin configs in neoforge.mods.toml; Forge reads the MixinConfigs manifest attribute.
            mixin_configs          : mixinConfigList.collect { "[[mixins]]\nconfig=\"${it}\"" }.join('\n\n')
    ].findAll { it.value != null }

    inputs.properties replaceProperties

    // Only this node's packaged language files receive the version-specific terminology.
    def languageOverrides = rootProject.file("versions/${project.name}/lang")
    inputs.files(fileTree(languageOverrides) { include '*.json' })
    doLast {
        fileTree(languageOverrides) { include '*.json' }.each { File overrides ->
            File target = new File(destinationDir, "assets/${pModId}/lang/${overrides.name}")
            def json = new groovy.json.JsonSlurper().parse(target)
            json.putAll(new groovy.json.JsonSlurper().parse(overrides))
            target.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)), 'UTF-8')
        }
    }

    // Forge reads META-INF/mods.toml, NeoForge 1.20.5+ reads META-INF/neoforge.mods.toml.
    exclude pLoader == 'forge' ? 'META-INF/neoforge.mods.toml' : 'META-INF/mods.toml'

    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [
                project: project,
                file   : [jarVersion: pVersion]
        ]
    }

    // The Mixin configs in src/ declare JAVA_17, which NeoForge nodes raise to their Java version in the
    // packaged copy. Forge 1.20.1 ships Mixin 0.8.5, which does not know JAVA_21 and only requires that its
    // ASM can read the mixin classes, so Forge nodes keep JAVA_17.
    if (pJava > 17 && pLoader != 'forge') {
        filesMatching('entitycontrol.*.mixins.json') {
            filter { String line -> line.replaceAll(/"compatibilityLevel"\s*:\s*"JAVA_\d+"/, "\"compatibilityLevel\": \"JAVA_${pJava}\"") }
        }
    }

    // Mixins whose target does not exist on this node (unavailable_mixins in versions/<node>/gradle.properties,
    // entries as written in the Mixin configs) are left out of the packaged configs. NeoForge runs on Mojang names
    // and has no refmap, so its configs drop the refmap entry.
    def unavailableMixins = (project.findProperty('unavailable_mixins')?.toString() ?: '')
            .split(',').collect { it.trim() }.findAll { !it.isEmpty() }
    boolean dropRefmap = pLoader != 'forge'
    inputs.property 'unavailableMixins', unavailableMixins
    def mixinOutput = destinationDir
    doLast {
        if (unavailableMixins.isEmpty() && !dropRefmap) return
        fileTree(mixinOutput) { include 'entitycontrol.*.mixins.json' }.each { File config ->
            def json = new groovy.json.JsonSlurper().parse(config)
            ['mixins', 'client', 'server'].each { String side ->
                if (json[side] instanceof List) json[side] = json[side].findAll { !(it in unavailableMixins) }
            }
            if (pLoader != 'forge' && config.name == 'entitycontrol.entityrese.mixins.json') {
                json.mixins.add('DummyCategoryPredicateMixin')
            }
            if (dropRefmap) json.remove('refmap')
            config.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)), 'UTF-8')
        }
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'       : pModId,
                'Specification-Vendor'      : project.findProperty('mod_authors')?.toString() ?: "Unknown",
                'Specification-Version'     : '1',
                'Implementation-Title'      : rootProject.name,
                'Implementation-Version'    : pVersion,
                'Implementation-Vendor'     : project.findProperty('mod_authors')?.toString() ?: "Unknown",
                'Implementation-Timestamp'  : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
        // Forge finds Mixin configs in the manifest; NeoForge only reads [[mixins]] in neoforge.mods.toml.
        if (pLoader == 'forge' && !mixinConfigList.isEmpty()) attributes('MixinConfigs': mixinConfigList.join(','))
    }
}

// Names and places the JAR that players install: <mod_id>-<loader>-<minecraft>-<version>.jar,
// for example kineticcore-forge-1.20.1-26.10.2.jar.
ext.kineticConfigureReleaseJar = { TaskProvider<? extends Jar> releaseJar ->
    releaseJar.configure {
        def customOutputDir = project.findProperty('output_mods_dir')
        if (customOutputDir) {
            def outputPath = customOutputDir.toString()
            def windowsAbsolutePath = outputPath.length() >= 3
                    && Character.isLetter(outputPath.charAt(0))
                    && outputPath.charAt(1) == (':' as char)
                    && (outputPath.charAt(2) == ('/' as char) || outputPath.charAt(2) == ('\\' as char))
            def runningOnWindows = System.getProperty('os.name').toLowerCase().contains('windows')

            // The shared Windows output directory is not a valid path on Linux CI runners.
            // Keep the configured path on Windows and use the root build/libs elsewhere.
            if (windowsAbsolutePath && !runningOnWindows) {
                destinationDirectory.set(rootProject.layout.buildDirectory.dir('libs'))
            } else {
                // A relative path such as build/release is relative to the repository root, not to versions/<node>/.
                destinationDirectory.set(rootProject.file(outputPath))
            }
        } else {
            destinationDirectory.set(rootProject.layout.buildDirectory.dir('libs'))
        }

        archiveFileName.set("${pModId}-${pLoader}-${pMinecraft}-${pVersion}.jar")
    }
}

