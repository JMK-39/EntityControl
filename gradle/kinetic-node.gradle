tasks.register('checkKineticMixinTargets', Exec) {
    group = 'verification'
    description = 'Checks that every Mixin target method and field exists in this node\'s Minecraft version.'
    dependsOn 'classes', 'processResources'
    def launcher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(pToolchain) }
    def checker = rootProject.file('gradle/KineticMixinTargetCheck.java')
    def classesDir = sourceSets.main.java.classesDirectory
    def resourcesDir = sourceSets.main.output.resourcesDir
    def compileClasspath = sourceSets.main.compileClasspath
    def toolClasspath = configurations.kineticMixinCheck
    def classpathFile = layout.buildDirectory.file('tmp/checkKineticMixinTargets/classpath.txt')
    // Mixins that already miss their target and are tracked separately: "<MixinClass>.<member>", comma-separated.
    def knownIssues = project.findProperty('known_mixin_issues')?.toString() ?: ''
    inputs.file(checker)
    doFirst {
        File file = classpathFile.get().asFile
        file.parentFile.mkdirs()
        file.setText(compileClasspath.files.join(File.pathSeparator), 'UTF-8')
        def command = [launcher.get().executablePath.asFile.absolutePath, '-cp', toolClasspath.asPath, checker.absolutePath,
                       classesDir.get().asFile.absolutePath, "--classpath-file=${file.absolutePath}",
                       "--configs=${resourcesDir.absolutePath}", "--known=${knownIssues}"]
        if (pLoader == 'forge') command += '--srg-runtime'
        commandLine command
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('checkKineticMixinTargets')
}


