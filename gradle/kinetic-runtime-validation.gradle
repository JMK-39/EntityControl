// Opt-in preservation fixture; never included in the shipped mod or the standard build.
def preservationMetadata = layout.buildDirectory.dir('gui-preservation-validation')
def writePreservationMetadata = tasks.register('writePreservationValidationMetadata') {
    inputs.property 'packFormat', project.property('pack_format')
    outputs.dir preservationMetadata
    doLast {
        def fileName = project.property('loader') == 'forge' ? 'mods.toml' : 'neoforge.mods.toml'
        File target = new File(preservationMetadata.get().asFile, "META-INF/${fileName}")
        target.parentFile.mkdirs()
        target.setText('modLoader="javafml"\nloaderVersion="[1,)"\nlicense="LGPLv3"\n[[mods]]\nmodId="entitycontrol_preservation_validation"\nversion="1.0.0"\ndisplayName="GUI preservation validation"\n', 'UTF-8')
        new File(preservationMetadata.get().asFile, 'pack.mcmeta').setText(
                '{"pack":{"description":"Opt-in GUI preservation fixture","pack_format":' + project.property('pack_format') + '}}', 'UTF-8')
    }
}
def preservationJar = tasks.register('guiPreservationValidationJar', Jar) {
    dependsOn 'testClasses', writePreservationMetadata
    from(sourceSets.test.output) { include 'dev/xyat/entitycontrolpreservationvalidation/*.class' }
    from preservationMetadata
    archiveFileName = 'entitycontrol-preservation-validation.jar'
}
if (project.property('loader') == 'forge') {
    afterEvaluate {
    def shipped = tasks.named('reobfJar').get()
    tasks.register('reobfGuiPreservationValidationJar', shipped.getClass().superclass) {
        dependsOn preservationJar
        input.set(preservationJar.flatMap { it.archiveFile })
        // Inherited Minecraft calls owned by addon entity classes also need their hierarchy.
        libraries.from(shipped.libraries, sourceSets.main.output)
        remapOperation.toolType.set(shipped.remapOperation.toolType)
        remapOperation.toolClasspath.from(shipped.remapOperation.toolClasspath)
        remapOperation.mappings.from(shipped.remapOperation.mappings)
        archiveFileName = 'entitycontrol-preservation-validation-reobf.jar'
    }
    }
}

if (project.property('loader') == 'neoforge') {
    def metadata = layout.buildDirectory.dir('runtime-validation')
    def writeMetadata = tasks.register('writeRuntimeValidationMetadata') {
        inputs.property 'fixtureCurioTag', 'minecraft:diamond'
        outputs.dir metadata
        doLast {
            File target = new File(metadata.get().asFile, 'META-INF/neoforge.mods.toml')
            target.parentFile.mkdirs()
            File tag = new File(metadata.get().asFile, 'data/curios/tags/item/curio.json')
            tag.parentFile.mkdirs()
            tag.setText('{"replace":false,"values":["minecraft:diamond"]}', 'UTF-8')
            target.setText('modLoader="javafml"\nloaderVersion="[1,)"\nlicense="LGPLv3"\n[[mods]]\nmodId="entitycontrol_validation"\nversion="1.0.0"\ndisplayName="EntityControl runtime validation"\n', 'UTF-8')
        }
    }
    tasks.register('runtimeValidationJar', Jar) {
        dependsOn 'testClasses', writeMetadata
        from(sourceSets.test.output) { include 'dev/xyat/entitycontrolvalidation/*.class' }
        from metadata
        archiveFileName = 'entitycontrol-validation.jar'
    }
}

// Forge 1.20.1: the GUI capture fixture as a reobfuscated mod, for running inside an installed modpack.
if (project.property('loader') == 'forge') {
    def captureMetadata = layout.buildDirectory.dir('gui-capture-validation')
    def writeCaptureMetadata = tasks.register('writeGuiCaptureValidationMetadata') {
        inputs.property 'packFormat', project.property('pack_format')
        inputs.property 'fixtureCurioTag', 'minecraft:diamond'
        outputs.dir captureMetadata
        doLast {
            File target = new File(captureMetadata.get().asFile, 'META-INF/mods.toml')
            target.parentFile.mkdirs()
            target.setText('modLoader="javafml"\nloaderVersion="[1,)"\nlicense="LGPLv3"\n[[mods]]\nmodId="entitycontrol_validation"\nversion="1.0.0"\ndisplayName="EntityControl GUI capture"\n', 'UTF-8')
            File tag = new File(captureMetadata.get().asFile, 'data/curios/tags/items/curio.json')
            tag.parentFile.mkdirs()
            tag.setText('{"replace":false,"values":["minecraft:diamond"]}', 'UTF-8')
            new File(captureMetadata.get().asFile, 'pack.mcmeta').setText(
                    '{"pack":{"description":"Opt-in GUI capture fixture","pack_format":' + project.property('pack_format') + '}}', 'UTF-8')
        }
    }
    def captureJar = tasks.register('guiCaptureValidationJar', Jar) {
        dependsOn 'testClasses', writeCaptureMetadata
        from(sourceSets.test.output) { include 'dev/xyat/entitycontrolvalidation/GuiLongTextValidation*.class', 'dev/xyat/entitycontrolvalidation/GuiCaptureForgeEntry.class', 'dev/xyat/entitycontrolvalidation/DummyItemValidation.class' }
        from captureMetadata
        archiveFileName = 'entitycontrol-gui-capture.jar'
    }
    afterEvaluate {
        def shipped = tasks.named('reobfJar').get()
        tasks.register('reobfGuiCaptureValidationJar', shipped.getClass().superclass) {
            dependsOn captureJar
            input.set(captureJar.flatMap { it.archiveFile })
            libraries.from(shipped.libraries, sourceSets.main.output)
            remapOperation.toolType.set(shipped.remapOperation.toolType)
            remapOperation.toolClasspath.from(shipped.remapOperation.toolClasspath)
            remapOperation.mappings.from(shipped.remapOperation.mappings)
            archiveFileName = 'entitycontrol-gui-capture-reobf.jar'
        }
    }
}

// Pure distance boundaries complement the opt-in in-game config/render fixture.
